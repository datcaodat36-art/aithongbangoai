<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#grad)"/>
  
  <!-- Robot head -->
  <rect x="22" y="16" width="20" height="20" rx="4" fill="white" opacity="0.9"/>
  
  <!-- Left eye -->
  <circle cx="26" cy="22" r="2.5" fill="#2563eb"/>
  
  <!-- Right eye -->
  <circle cx="38" cy="22" r="2.5" fill="#2563eb"/>
  
  <!-- Smile -->
  <path d="M 26 28 Q 32 30 38 28" stroke="#2563eb" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Left antenna -->
  <line x1="24" y1="14" x2="20" y2="8" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="20" cy="8" r="1.5" fill="white"/>
  
  <!-- Right antenna -->
  <line x1="40" y1="14" x2="44" y2="8" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="44" cy="8" r="1.5" fill="white"/>
  
  <!-- Body/Circuit pattern -->
  <rect x="20" y="38" width="24" height="16" rx="3" fill="white" opacity="0.85"/>
  
  <!-- Circuit lines -->
  <line x1="28" y1="38" x2="28" y2="54" stroke="#2563eb" stroke-width="1" opacity="0.5"/>
  <line x1="36" y1="38" x2="36" y2="54" stroke="#2563eb" stroke-width="1" opacity="0.5"/>
  <line x1="20" y1="46" x2="44" y2="46" stroke="#2563eb" stroke-width="1" opacity="0.5"/>
  
  <!-- Nodes -->
  <circle cx="28" cy="42" r="1.2" fill="#2563eb"/>
  <circle cx="36" cy="42" r="1.2" fill="#2563eb"/>
  <circle cx="28" cy="50" r="1.2" fill="#2563eb"/>
  <circle cx="36" cy="50" r="1.2" fill="#2563eb"/>
</svg>
